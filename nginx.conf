# uleeb.twedot.com — kept in its own file (synced to /etc/nginx/sites-available/uleeb-web
# by this repo's own deploy workflow), deliberately never touching twedot-backend's or
# uleeb-api's own nginx configs. Same box, same nginx install, but this project's deploys
# can never break theirs and vice versa.
server {
    listen 80;
    server_name uleeb.twedot.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name uleeb.twedot.com;

    ssl_certificate /etc/letsencrypt/live/uleeb.twedot.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uleeb.twedot.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /home/ubuntu/uleeb-web/dist;
    index index.html;

    # A pure client-side SPA (no server routing) — any path that isn't a
    # real static file falls back to index.html so a direct load of, say,
    # /features doesn't 404 (not that any such route exists yet, but this
    # is the standard SPA-safe default).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
