<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Loaded here (not via CSS @import) so it fetches in parallel with the
         page instead of blocking on the stylesheet parse — same reasoning as
         Twedot's own site. Space Grotesk for display/headline text, matching
         the uleeb app's own type system; Inter for body copy. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uleeb — Find your next home, swipe by swipe</title>
    <meta name="description" content="uleeb is a Nigeria-first rental marketplace — swipe to discover verified homes, chat directly with landlords, and schedule inspections without the middleman." />
    <meta name="keywords" content="uleeb, rentals Nigeria, apartment finder, verified listings, landlord tenant app, house hunting Nigeria" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Twedot" />

    <!-- Open Graph -->
    <meta property="og:title" content="uleeb — Find your next home, swipe by swipe" />
    <meta property="og:description" content="Swipe to discover verified rentals, chat directly with landlords, and schedule inspections — no middleman." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://uleeb.twedot.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="uleeb — Find your next home, swipe by swipe" />
    <meta name="twitter:description" content="Swipe to discover verified rentals, chat directly with landlords, and schedule inspections — no middleman." />
    <meta name="twitter:image" content="/og-image.png" />
